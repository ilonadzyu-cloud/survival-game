<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d0c" />
<title>Не та рибалка</title>
<style>
  :root{
    --bg:#090c0b;
    --panel:#111513;
    --panel2:#171c19;
    --text:#e9e2d4;
    --muted:#9f9a90;
    --line:#2b332f;
    --accent:#7f302d;
    --accent2:#415247;
    --good:#879174;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
  body{min-height:100vh}
  button{font:inherit}
  .app{max-width:760px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
  .topbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .brand{font:700 13px/1.1 system-ui,-apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#cfc8b9}
  .top-actions{display:flex;gap:8px}
  .smallbtn{min-height:42px;border:1px solid var(--line);background:#0f1311;color:var(--text);border-radius:10px;padding:8px 11px;font:600 13px/1 system-ui,-apple-system,sans-serif}
  .smallbtn:disabled{opacity:.45}

  .scene{position:relative;height:250px;overflow:hidden;border:1px solid #202724;border-radius:18px;background:#111;isolation:isolate}
  .scene::before,.scene::after{content:"";position:absolute;inset:0;pointer-events:none}
  .scene::before{background:radial-gradient(circle at 50% 35%,transparent 0 28%,rgba(0,0,0,.32) 66%,rgba(0,0,0,.72) 100%);z-index:4}
  .scene::after{opacity:.16;z-index:5;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 4px)}
  .sky{position:absolute;inset:0;background:linear-gradient(#39423f 0%,#5a5c50 44%,#272e29 100%)}
  .fog{position:absolute;left:-10%;right:-10%;bottom:28%;height:34%;background:linear-gradient(90deg,transparent 0%,rgba(215,213,199,.09) 24%,rgba(215,213,199,.2) 48%,rgba(215,213,199,.07) 72%,transparent 100%)}
  .ground{position:absolute;left:-10%;right:-10%;bottom:-28px;height:43%;background:#1f2922;border-radius:50% 50% 0 0/18% 18% 0 0}
  .fence{position:absolute;left:4%;right:4%;bottom:43px;height:70px;opacity:.82}
  .fence i{position:absolute;bottom:0;width:8px;height:70px;background:#322b24;border-radius:2px}
  .fence b{position:absolute;left:0;right:0;height:7px;background:#3a3129;transform:rotate(-1deg)}
  .fence b:nth-of-type(1){top:19px}.fence b:nth-of-type(2){top:49px}
  .house{display:none;position:absolute;bottom:43px;width:115px;height:76px;background:#2c2923;border:1px solid #191816}
  .house::before{content:"";position:absolute;left:-9px;top:-40px;border-left:66px solid transparent;border-right:66px solid transparent;border-bottom:44px solid #211f1b}
  .house::after{content:"";position:absolute;left:17px;bottom:16px;width:18px;height:23px;background:#8b6d40;box-shadow:57px 0 0 #6d5737;opacity:.55}
  .h1{left:9%}.h2{right:7%;transform:scale(.82);transform-origin:bottom right}
  .tree{display:none;position:absolute;bottom:35px;width:28px;height:128px;background:#181d19;border-radius:40% 45% 12px 12px}
  .tree::before{content:"";position:absolute;left:-36px;top:-42px;width:98px;height:85px;border-radius:50%;background:#162019;box-shadow:-21px 22px 0 #18231b,22px 18px 0 #131c16}
  .t1{left:8%}.t2{right:9%;transform:scale(.78);transform-origin:bottom}
  .pigeon{display:none;position:absolute;right:21%;bottom:106px;width:38px;height:28px;border-radius:55% 55% 45% 45%;background:#313833;z-index:3}
  .pigeon::before{content:"";position:absolute;right:-7px;top:3px;width:18px;height:18px;border-radius:50%;background:#3b433e}
  .pigeon::after{content:"";position:absolute;right:-12px;top:9px;border-left:8px solid #927c55;border-top:3px solid transparent;border-bottom:3px solid transparent}
  .label{position:absolute;left:14px;bottom:12px;z-index:6;padding:6px 9px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(7,9,8,.73);font:600 12px/1 system-ui,-apple-system,sans-serif;color:#d5cfc3}

  .scene.village .house,.scene.village .tree{display:block}
  .scene.village .fence{opacity:.5}
  .scene.pigeon-scene .house,.scene.pigeon-scene .tree,.scene.pigeon-scene .pigeon{display:block}
  .scene.dark .sky{background:linear-gradient(#1f2827 0%,#343932 47%,#171c19 100%)}

  .panel{margin-top:12px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#121714,#0e1210);padding:18px 16px}
  .chapter{font:700 12px/1 system-ui,-apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8f8a80;margin-bottom:10px}
  .story{white-space:pre-line;font-size:18px;line-height:1.68;color:var(--text)}
  .choices{display:grid;gap:10px;margin-top:18px}
  .choice{width:100%;min-height:52px;text-align:left;color:var(--text);background:#171c19;border:1px solid #313a35;border-radius:12px;padding:13px 14px;font-size:16px;line-height:1.35}
  .choice:active{background:#222a25;border-color:#46524c}
  .next{text-align:center;font-family:system-ui,-apple-system,sans-serif;font-weight:700}
  .result{margin-top:14px;border-left:3px solid var(--accent);background:#171412;padding:11px 12px;border-radius:8px;font:600 13px/1.45 system-ui,-apple-system,sans-serif;color:#d8d0c2}
  .status-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .status{border:1px solid #384139;border-radius:999px;background:#151a17;padding:7px 9px;font:700 12px/1 system-ui,-apple-system,sans-serif;color:#cbc5ba}
  .status.bad{border-color:#583330;background:#1e1514;color:#d4b2ab}
  .status.good{border-color:#465243;background:#171c16;color:#c5cbb8}
  .save-note{min-height:18px;margin-top:10px;color:#827f77;font:12px/1.4 system-ui,-apple-system,sans-serif}

  .start{padding:30px 0 8px}
  .title{font-size:38px;line-height:1.05;margin:0 0 8px;letter-spacing:.01em}
  .subtitle{color:var(--muted);font-size:16px;line-height:1.5;margin-bottom:20px}
  .start-actions{display:grid;gap:10px}
  .primary{min-height:54px;border:1px solid #4a302e;border-radius:12px;background:#251817;color:#eadfd8;font:800 15px/1 system-ui,-apple-system,sans-serif}
  .secondary{min-height:52px;border:1px solid var(--line);border-radius:12px;background:#121714;color:#d8d1c4;font:700 15px/1 system-ui,-apple-system,sans-serif}
  .secondary:disabled{opacity:.42}
  .storage-note{margin-top:14px;color:#77756e;font:12px/1.45 system-ui,-apple-system,sans-serif}

  @media (max-width:520px){
    .scene{height:215px}
    .story{font-size:17px}
    .panel{padding:16px 14px}
    .title{font-size:34px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">НЕ ТА РИБАЛКА</div>
    <div class="top-actions" id="topActions" hidden>
      <button class="smallbtn" id="saveBtn" type="button">Зберегти</button>
      <button class="smallbtn" id="menuBtn" type="button">Меню</button>
    </div>
  </div>

  <section id="startScreen" class="start">
    <h1 class="title">Не та рибалка</h1>
    <div class="subtitle">Текстова виживалка. Чорна комедія, хорор і рішення, які іноді краще було не приймати.</div>
    <div class="start-actions">
      <button class="primary" id="newBtn" type="button">Нова гра</button>
      <button class="secondary" id="continueBtn" type="button">Продовжити</button>
    </div>
    <div class="storage-note">Прогрес зберігається у цьому браузері на цьому пристрої.</div>
  </section>

  <main id="game" hidden>
    <div id="scene" class="scene dark">
      <div class="sky"></div><div class="fog"></div><div class="ground"></div>
      <div class="fence"><b></b><b></b><i style="left:7%"></i><i style="left:19%"></i><i style="left:33%"></i><i style="left:48%"></i><i style="left:64%"></i><i style="left:81%"></i><i style="left:94%"></i></div>
      <div class="house h1"></div><div class="house h2"></div><div class="tree t1"></div><div class="tree t2"></div><div class="pigeon"></div>
      <div id="sceneLabel" class="label">Ранок</div>
    </div>

    <section class="panel">
      <div class="chapter">Розділ 1</div>
      <div id="story" class="story"></div>
      <div id="result" class="result" hidden></div>
      <div id="choices" class="choices"></div>
      <div id="statuses" class="status-wrap"></div>
      <div id="saveNote" class="save-note" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
(function(){
  'use strict';
  var KEY='ne-ta-rybalka-save-v1';
  var startScreen=document.getElementById('startScreen');
  var game=document.getElementById('game');
  var topActions=document.getElementById('topActions');
  var continueBtn=document.getElementById('continueBtn');
  var newBtn=document.getElementById('newBtn');
  var saveBtn=document.getElementById('saveBtn');
  var menuBtn=document.getElementById('menuBtn');
  var story=document.getElementById('story');
  var choices=document.getElementById('choices');
  var result=document.getElementById('result');
  var statuses=document.getElementById('statuses');
  var saveNote=document.getElementById('saveNote');
  var scene=document.getElementById('scene');
  var sceneLabel=document.getElementById('sceneLabel');

  function fresh(){return {node:'intro1',pohuizm:2,attention:-2,agility:-1,thirst:25,pigeonRep:0,dirty:0,birdHumiliated:false,notes:[]};}
  var state=fresh();

  var nodes={
    intro1:{
      scene:'dark', label:'Ранок. Десь не там.',
      text:'Останнє, що ви пам’ятаєте – рибалка.\n\nКомарі вас жерли, собаки такі. Поплавок не рухався вже хрін знає скільки. Хтось відкрив ще одну пляшку. Далі пам’ять починає працювати кусками.',
      next:'intro2'
    },
    intro2:{
      scene:'dark', label:'Мокра трава. Чужий паркан.',
      text:'Ви відкриваєте очі.\n\nПід вами мокра трава. Перед носом старий дерев’яний паркан. Голова гуде. У роті сухо.\n\nПерша думка: «Блять. Де я?»\n\nДруга: «Капнути б водички».',
      next:'intro3'
    },
    intro3:{
      scene:'village dark', label:'Село. Ранок.',
      text:'Ви сідаєте й дивитесь навколо.\n\nЗа парканом старі хати. Дорога втоптана. Ні машин, ні проводів. Тихо.\n\nДесь далеко гавкає собака.\n\nВи ще не встигли нормально подумати, як на плече падає щось тепле.',
      next:'pigeon'
    },
    pigeon:{
      scene:'pigeon-scene dark', label:'Паркан. Один жирний голуб.',
      text:'На куртці свіжа біло-зелена купа.\n\nНа паркані сидить голуб. Жирний, упітаний. Дивиться прямо на вас.\n\nСука.',
      choices:[
        ['Кинути в нього каменюкою',function(){state.pigeonRep-=2;state.birdHumiliated=true;state.dirty+=1;state.notes.push('Кинули камінь у голуба');go('stone')}],
        ['Витерти плече травою',function(){state.birdHumiliated=true;state.notes.push('Витерли плече травою');go('wipe')}],
        ['Сказати: «Я тебе запам’ятав»',function(){state.pigeonRep+=1;state.birdHumiliated=true;state.notes.push('Офіційно звернулись до голуба');go('remember')}],
        ['Не чіпати. Може, тут це якийсь місцевий обряд',function(){state.pigeonRep+=2;state.dirty+=2;state.pohuizm+=1;state.birdHumiliated=true;state.notes.push('Не стали чіпати голубине лайно');go('leave')}]
      ]
    },
    stone:{
      scene:'pigeon-scene dark', label:'Паркан.',
      text:'Камінь летить повз голуба й б’є в металеве відро за парканом.\n\nГуркіт на все село.\n\nГолуб не відлітає. Просто дивиться на вас ще уважніше.',
      result:'Голуби це запам’ятають.',
      next:'end'
    },
    wipe:{
      scene:'village dark', label:'Паркан.',
      text:'Ви витираєте плече травою.\n\nСтало не добре. Просто менше видно.\n\nГолуб сидить на місці.',
      result:'Стан: ПТАХ ВАС ПРИНИЗИВ.',
      next:'end'
    },
    remember:{
      scene:'pigeon-scene dark', label:'Паркан.',
      text:'– Я тебе запам’ятав.\n\nГолуб нахиляє голову набік.\n\nПотім на інший.\n\nВи не знаєте чому, але складається враження, що він теж вас запам’ятав.',
      result:'Щось змінилося у відносинах з голубами.',
      next:'end'
    },
    leave:{
      scene:'pigeon-scene dark', label:'Паркан.',
      text:'Ви дивитесь на плече. Потім на голуба.\n\n– Ладно. Хуй з тобою.\n\nГолуб роздуває груди.',
      result:'Похуїзм +1. Бруд +2. Голуби: підозріло довольні.',
      next:'end'
    },
    end:{
      scene:'village dark', label:'Село. Далі.',
      text:'Ви встаєте.\n\nСело мовчить.\n\nПопереду дорога між хатами. За ними темніє ліс.\n\nДесь позаду знову воркує голуб.\n\nВи не обертаєтесь.',
      result:'Кінець тестового шматка першого розділу.',
      end:true
    }
  };

  function safeLoad(){
    try{
      var raw=localStorage.getItem(KEY);
      if(!raw)return null;
      var parsed=JSON.parse(raw);
      if(!parsed || !parsed.node || !nodes[parsed.node])return null;
      return parsed;
    }catch(e){return null;}
  }

  function save(silent){
    try{
      localStorage.setItem(KEY,JSON.stringify(state));
      if(!silent){saveNote.textContent='Збережено.';setTimeout(function(){saveNote.textContent='';},1200);}
      updateContinue();
    }catch(e){
      if(!silent)saveNote.textContent='Не вдалося зберегти прогрес у цьому браузері.';
    }
  }

  function updateContinue(){continueBtn.disabled=!safeLoad();}

  function setScene(classes,label){scene.className='scene '+classes;sceneLabel.textContent=label;}

  function renderStatuses(){
    statuses.innerHTML='';
    addStatus('ЖОСТКИЙ БУДУНЯРА','bad');
    if(state.birdHumiliated)addStatus('ПТАХ ВАС ПРИНИЗИВ','bad');
    if(state.dirty>=2)addStatus('ДИКИЙ СКУНС','bad');
  }

  function addStatus(text,kind){
    var span=document.createElement('span');span.className='status '+(kind||'');span.textContent=text;statuses.appendChild(span);
  }

  function button(text,fn,extra){
    var b=document.createElement('button');b.type='button';b.className='choice '+(extra||'');b.textContent=text;b.addEventListener('click',fn);return b;
  }

  function go(id){state.node=id;save(true);render();}

  function render(){
    var n=nodes[state.node];
    setScene(n.scene,n.label);
    story.textContent=n.text;
    result.hidden=!n.result;
    result.textContent=n.result||'';
    choices.innerHTML='';
    renderStatuses();
    if(n.choices){
      n.choices.forEach(function(item){choices.appendChild(button(item[0],item[1]));});
    }else if(n.next){
      choices.appendChild(button('Далі',function(){go(n.next);},'next'));
    }else if(n.end){
      choices.appendChild(button('Почати цей шматок заново',function(){state=fresh();save(true);render();},'next'));
    }
  }

  function enterGame(){startScreen.hidden=true;game.hidden=false;topActions.hidden=false;render();}
  function showMenu(){game.hidden=true;topActions.hidden=true;startScreen.hidden=false;updateContinue();}

  newBtn.addEventListener('click',function(){state=fresh();save(true);enterGame();});
  continueBtn.addEventListener('click',function(){var loaded=safeLoad();if(loaded){state=Object.assign(fresh(),loaded);enterGame();}});
  saveBtn.addEventListener('click',function(){save(false);});
  menuBtn.addEventListener('click',showMenu);

  updateContinue();
})();
</script>
</body>
</html>
